suite: deployment tests
templates:
  - templates/deployment.yaml
tests:
  - it: should render deployment with defaults
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.replicas
          value: 1
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ^ghcr\.io/attune-io/attune:[0-9]+\.[0-9]+\.[0-9]+$
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true

  - it: should default image tag to bare appVersion not a v prefix
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: :[0-9]+\.[0-9]+\.[0-9]+$
      - notMatchRegex:
          path: spec.template.spec.containers[0].image
          pattern: :v[0-9]+\.[0-9]+\.[0-9]+$

  - it: should use explicit image.tag without adding a v prefix
    set:
      image.tag: e2e
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/attune-io/attune:e2e

  - it: should keep an explicit v-prefixed image.tag unchanged
    set:
      image.tag: v0.1.23
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/attune-io/attune:v0.1.23

  - it: should treat whitespace-only image.tag as unset
    set:
      image.tag: "   "
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: :[0-9]+\.[0-9]+\.[0-9]+$

  - it: should set replicas from values
    set:
      replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].maxSkew
          value: 1
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].whenUnsatisfiable
          value: ScheduleAnyway

  - it: should enable leader election when set
    set:
      leaderElection.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --leader-elect

  - it: should expose webhook port when webhooks enabled
    set:
      webhooks.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: webhook
            containerPort: 9443
            protocol: TCP

  - it: should mount webhook certs when webhooks enabled
    set:
      webhooks.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: webhook-certs
            mountPath: /tmp/k8s-webhook-server/serving-certs
            readOnly: true

  - it: should pass collector-ttl arg with default value
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --collector-ttl=10m

  - it: should pass custom collector-ttl arg
    set:
      collectorTTL: "30m"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --collector-ttl=30m

  - it: should accept compound Go duration for collector-ttl
    set:
      collectorTTL: "1h30m"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --collector-ttl=1h30m

  - it: should pass prometheus-timeout arg with default value
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --prometheus-timeout=5m

  - it: should pass custom prometheus-timeout arg
    set:
      prometheusTimeout: "10m"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --prometheus-timeout=10m

  - it: should disable metrics server when metrics disabled
    set:
      metrics.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --metrics-bind-address=0

  - it: should disable webhooks via flag
    set:
      webhooks.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --enable-webhooks=false
      - notContains:
          path: spec.template.spec.containers[0].ports
          content:
            name: webhook
          any: true

  # --- Prometheus rate limit args ---

  - it: should pass prometheus-use-service-account-token when prometheusAuth is set
    set:
      prometheusAuth:
        useServiceAccountToken: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --prometheus-use-service-account-token

  - it: should pass prometheus-use-service-account-token when bindClusterMonitoringView is set
    set:
      openshift:
        bindClusterMonitoringView: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --prometheus-use-service-account-token

  - it: should pass operator-namespace datadog api key flags
    set:
      datadogAuth:
        existingSecret:
          name: datadog-keys
          key: api-key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --datadog-api-key-secret=datadog-keys
      - contains:
          path: spec.template.spec.containers[0].args
          content: --datadog-api-key-secret-key=api-key

  - it: should pass sigv4 allowlists and can disable namespace enforcement
    set:
      sigv4:
        allowedRoleArns:
          - "arn:aws:iam::123456789012:role/attune-*"
        allowedWorkspaceHosts:
          - "aps-workspaces.us-east-1.amazonaws.com"
      sloGuardrails:
        enforceNamespace: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --sigv4-allowed-role-arns=arn:aws:iam::123456789012:role/attune-*
      - contains:
          path: spec.template.spec.containers[0].args
          content: --sigv4-allowed-workspace-hosts=aps-workspaces.us-east-1.amazonaws.com
      - contains:
          path: spec.template.spec.containers[0].args
          content: --slo-guardrail-enforce-namespace=false

  - it: should not pass datadog api key flags by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --datadog-api-key-secret

  - it: should pass operator-namespace bearer secret flags
    set:
      prometheusAuth:
        existingSecret:
          name: attune-thanos-token
          key: token
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --prometheus-bearer-token-secret=attune-thanos-token
      - contains:
          path: spec.template.spec.containers[0].args
          content: --prometheus-bearer-token-key=token

  - it: should pass default prometheus-qps and prometheus-burst args
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --prometheus-qps=10
      - contains:
          path: spec.template.spec.containers[0].args
          content: --prometheus-burst=20

  - it: should pass explicit prometheus-qps override
    set:
      prometheusQPS: 50
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --prometheus-qps=50

  - it: should pass explicit prometheus-burst override
    set:
      prometheusBurst: 100
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --prometheus-burst=100

  # --- clusterSize presets ---

  - it: should apply small preset defaults with no clusterSize
    asserts:
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi

  - it: should apply medium preset values
    set:
      clusterSize: medium
    asserts:
      - equal:
          path: spec.replicas
          value: 1
      - contains:
          path: spec.template.spec.containers[0].args
          content: --prometheus-qps=20
      - contains:
          path: spec.template.spec.containers[0].args
          content: --prometheus-burst=40
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            limits:
              cpu: 1000m
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 256Mi

  - it: should apply large preset values with 2 replicas
    set:
      clusterSize: large
    asserts:
      - equal:
          path: spec.replicas
          value: 2
      - contains:
          path: spec.template.spec.containers[0].args
          content: --prometheus-qps=40
      - contains:
          path: spec.template.spec.containers[0].args
          content: --prometheus-burst=80
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            limits:
              cpu: 2000m
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 512Mi

  - it: should apply xlarge preset values
    set:
      clusterSize: xlarge
    asserts:
      - equal:
          path: spec.replicas
          value: 2
      - contains:
          path: spec.template.spec.containers[0].args
          content: --prometheus-qps=80
      - contains:
          path: spec.template.spec.containers[0].args
          content: --prometheus-burst=160
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            limits:
              cpu: 4000m
              memory: 4Gi
            requests:
              cpu: 1000m
              memory: 1Gi

  # --- maxConcurrentReconciles ---

  - it: should not pass max-concurrent-reconciles when empty (default)
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --max-concurrent-reconciles=
          any: true

  - it: should pass explicit max-concurrent-reconciles
    set:
      maxConcurrentReconciles: 4
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --max-concurrent-reconciles=4

  - it: should apply max-concurrent-reconciles from medium preset
    set:
      clusterSize: medium
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --max-concurrent-reconciles=2

  - it: should apply max-concurrent-reconciles from xlarge preset
    set:
      clusterSize: xlarge
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --max-concurrent-reconciles=8

  # --- watchNamespaces ---

  - it: should not pass watch-namespaces when empty (default)
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --watch-namespaces=
          any: true

  - it: should pass watch-namespaces as comma-separated list
    set:
      watchNamespaces:
        - production
        - staging
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --watch-namespaces=production,staging

  - it: should pass single watch-namespace
    set:
      watchNamespaces:
        - my-namespace
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --watch-namespaces=my-namespace

  # --- FIPS 140-3 ---

  - it: should not set GODEBUG env when fips disabled (default)
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GODEBUG

  - it: should set GODEBUG fips140=on when fips enabled
    set:
      fips:
        enabled: true
        mode: "on"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GODEBUG
            value: "fips140=on"

  - it: should set GODEBUG fips140=only when mode is only
    set:
      fips:
        enabled: true
        mode: "only"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GODEBUG
            value: "fips140=only"

  - it: should let explicit values override large preset
    set:
      clusterSize: large
      prometheusQPS: 60
      replicaCount: 3
      resources:
        requests:
          cpu: 999m
          memory: 999Mi
        limits:
          cpu: 3000m
          memory: 3Gi
    asserts:
      - equal:
          path: spec.replicas
          value: 3
      - contains:
          path: spec.template.spec.containers[0].args
          content: --prometheus-qps=60
      - contains:
          path: spec.template.spec.containers[0].args
          content: --prometheus-burst=80
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            limits:
              cpu: 3000m
              memory: 3Gi
            requests:
              cpu: 999m
              memory: 999Mi

  - it: should pass fleet-report flags when enabled
    set:
      fleetReport:
        enabled: true
        configMapName: attune-fleet-report
        clusterId: prod-us
        interval: 10m
        namespace: attune-system
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --fleet-report-enabled=true
      - contains:
          path: spec.template.spec.containers[0].args
          content: --fleet-report-configmap=attune-fleet-report
      - contains:
          path: spec.template.spec.containers[0].args
          content: --fleet-report-cluster-id=prod-us
      - contains:
          path: spec.template.spec.containers[0].args
          content: --fleet-report-interval=10m
      - contains:
          path: spec.template.spec.containers[0].args
          content: --fleet-report-namespace=attune-system
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace

  - it: should pass weekly report flags and the shared cluster id
    set:
      fleetReport:
        clusterId: prod-us
      weeklyReport:
        enabled: true
        endpoints:
          - name: slack
            secretName: attune-weekly-report
            secretKey: slack-url
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --weekly-report-enabled=true
      - contains:
          path: spec.template.spec.containers[0].args
          content: --weekly-report-endpoint=slack/attune-weekly-report/slack-url
      - contains:
          path: spec.template.spec.containers[0].args
          content: --fleet-report-cluster-id=prod-us
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --fleet-report-enabled=true
      - notContains:
          path: spec.template.spec.containers[0].args
          content: https://

  - it: should reject two weekly endpoints that share a secret key
    set:
      weeklyReport:
        enabled: true
        endpoints:
          - name: slack
            secretName: attune-weekly-report
            secretKey: slack-url
          - name: teams
            secretName: attune-weekly-report
            secretKey: slack-url
    asserts:
      - failedTemplate:
          errorMessage: weeklyReport.endpoints must not share a Secret key

  - it: should pass metrics-secure by default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --metrics-bind-address=:8080
      - contains:
          path: spec.template.spec.containers[0].args
          content: --metrics-secure=true
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            mountPath: /tmp/k8s-metrics-server/serving-certs

  - it: should pass metrics-secure false without a cert volume
    set:
      metrics.secure: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --metrics-secure=false
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            mountPath: /tmp/k8s-metrics-server/serving-certs

  - it: should omit metrics-secure when metrics are disabled
    set:
      metrics.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --metrics-bind-address=0
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --metrics-secure
          any: true

  - it: should omit spread when one replica is rendered
    asserts:
      - notExists:
          path: spec.template.spec.topologySpreadConstraints

  - it: should omit spread for the small and medium presets
    set:
      clusterSize: small
    asserts:
      - equal:
          path: spec.replicas
          value: 1
      - notExists:
          path: spec.template.spec.topologySpreadConstraints

  - it: should omit spread for the medium preset
    set:
      clusterSize: medium
    asserts:
      - notExists:
          path: spec.template.spec.topologySpreadConstraints

  - it: should spread large preset replicas
    set:
      clusterSize: large
    asserts:
      - equal:
          path: spec.replicas
          value: 2
      - equal:
          path: spec.template.spec.topologySpreadConstraints
          value:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: attune
                  app.kubernetes.io/instance: RELEASE-NAME

  - it: should spread xlarge preset replicas
    set:
      clusterSize: xlarge
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].whenUnsatisfiable
          value: ScheduleAnyway
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].labelSelector.matchLabels
          value:
            app.kubernetes.io/name: attune
            app.kubernetes.io/instance: RELEASE-NAME

  - it: should spread an explicit replica count of 2
    set:
      replicaCount: 2
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: kubernetes.io/hostname

  - it: should spread replicaCount 3 and large with replicaCount 3
    set:
      clusterSize: large
      replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].maxSkew
          value: 1

  - it: should inject spread when the constraint list is empty
    set:
      replicaCount: 2
      topologySpreadConstraints: []
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].whenUnsatisfiable
          value: ScheduleAnyway

  - it: should keep a user spread constraint
    set:
      replicaCount: 2
      topologySpreadConstraints:
        - maxSkew: 2
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: custom
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints
          value:
            - maxSkew: 2
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: custom
      - notContains:
          path: spec.template.spec.topologySpreadConstraints
          content:
            topologyKey: kubernetes.io/hostname

  - it: should keep a user constraint when one replica is rendered
    set:
      replicaCount: 1
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: attune
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: topology.kubernetes.io/zone

  - it: should use nameOverride on the injected selector
    set:
      replicaCount: 2
      nameOverride: custom
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].labelSelector.matchLabels
          value:
            app.kubernetes.io/name: custom
            app.kubernetes.io/instance: RELEASE-NAME
