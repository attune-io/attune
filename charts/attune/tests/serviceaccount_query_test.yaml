suite: query serviceaccount
templates:
  - templates/serviceaccount-query.yaml
tests:
  - it: should not render when queryServiceAccount.create is false
    asserts:
      - hasDocuments:
          count: 0

  - it: should render ServiceAccount Role and RoleBinding
    set:
      prometheusAuth:
        queryServiceAccount:
          create: true
          name: attune-prometheus-query
    asserts:
      - hasDocuments:
          count: 3
      - documentIndex: 0
        isKind:
          of: ServiceAccount
      - documentIndex: 0
        equal:
          path: metadata.name
          value: attune-prometheus-query
      - documentIndex: 1
        isKind:
          of: Role
      - documentIndex: 1
        equal:
          path: rules[0].resources[0]
          value: serviceaccounts/token
      - documentIndex: 2
        isKind:
          of: RoleBinding
