suite: prometheusrule tests
templates:
  - templates/prometheusrule.yaml
tests:
  - it: should not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render when enabled
    set:
      metrics:
        enabled: true
        prometheusRule:
          enabled: true
    asserts:
      - isKind:
          of: PrometheusRule
      - equal:
          path: spec.groups[0].name
          value: attune

  - it: should include all fourteen default alerts
    set:
      metrics:
        enabled: true
        prometheusRule:
          enabled: true
    asserts:
      - lengthEqual:
          path: spec.groups[0].rules
          count: 14

  - it: should disable individual rules
    set:
      metrics:
        enabled: true
        prometheusRule:
          enabled: true
          rules:
            reconcileErrors:
              enabled: false
            degraded:
              enabled: false
    asserts:
      - lengthEqual:
          path: spec.groups[0].rules
          count: 12

  - it: should include AttuneGitOpsPRFailures by default
    set:
      metrics:
        enabled: true
        prometheusRule:
          enabled: true
    asserts:
      - equal:
          path: spec.groups[0].rules[12].alert
          value: AttuneGitOpsPRFailures
      - equal:
          path: spec.groups[0].rules[12].for
          value: 15m

  - it: should include AttuneMemoryLimitUnsafe by default
    set:
      metrics:
        enabled: true
        prometheusRule:
          enabled: true
    asserts:
      - equal:
          path: spec.groups[0].rules[13].alert
          value: AttuneMemoryLimitUnsafe
      - equal:
          path: spec.groups[0].rules[13].labels.severity
          value: info

  - it: should omit gitops PR alert when disabled
    set:
      metrics:
        enabled: true
        prometheusRule:
          enabled: true
          rules:
            gitopsPRFailures:
              enabled: false
    asserts:
      - lengthEqual:
          path: spec.groups[0].rules
          count: 13
      - equal:
          path: spec.groups[0].rules[12].alert
          value: AttuneMemoryLimitUnsafe

  - it: should omit memory limit unsafe alert when disabled
    set:
      metrics:
        enabled: true
        prometheusRule:
          enabled: true
          rules:
            memoryLimitUnsafe:
              enabled: false
    asserts:
      - lengthEqual:
          path: spec.groups[0].rules
          count: 13
      - equal:
          path: spec.groups[0].rules[12].alert
          value: AttuneGitOpsPRFailures

  - it: should apply additional labels
    set:
      metrics:
        enabled: true
        prometheusRule:
          enabled: true
          additionalLabels:
            team: platform
    asserts:
      - equal:
          path: metadata.labels.team
          value: platform

  - it: should not render when metrics disabled
    set:
      metrics:
        enabled: false
        prometheusRule:
          enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should use custom severity
    set:
      metrics:
        enabled: true
        prometheusRule:
          enabled: true
          rules:
            reconcileErrors:
              enabled: true
              severity: critical
    asserts:
      - equal:
          path: spec.groups[0].rules[0].labels.severity
          value: critical

  - it: should include fleet recording rules when enabled
    set:
      metrics:
        enabled: true
        prometheusRule:
          enabled: true
          fleetRecordingRules:
            enabled: true
    asserts:
      - equal:
          path: spec.groups[1].name
          value: attune-fleet.rules
      - lengthEqual:
          path: spec.groups[1].rules
          count: 6
