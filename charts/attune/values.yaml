---
# attune Helm chart values

# -- Number of operator replicas (use 2 for HA with leader election)
replicaCount: 1

image:
  # -- Container image repository
  repository: ghcr.io/attune-io/attune
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image tag (defaults to Chart appVersion)
  tag: ""

# -- Image pull secrets
imagePullSecrets: []

# -- Override the chart name
nameOverride: ""
# -- Override the full name
fullnameOverride: ""

serviceAccount:
  # -- Create a ServiceAccount
  create: true
  # -- Annotations to add to the ServiceAccount
  annotations: {}
  # -- ServiceAccount name (generated if not set)
  name: ""

# -- Pod annotations
podAnnotations: {}

# -- Pod security context
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# -- Container security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532

# -- Operator pod resources. When empty, defaults are derived from clusterSize (or "small" if clusterSize is also empty). Set explicit values for production.
resources: {}

# -- Priority class name for the operator pod (recommended: system-cluster-critical for production)
priorityClassName: ""

# -- Node selector
nodeSelector: {}

# -- Tolerations
tolerations: []

# -- Affinity rules
affinity: {}

# -- Topology spread constraints
topologySpreadConstraints: []

# -- Leader election (enable for HA with replicaCount > 1)
leaderElection:
  enabled: true

# Prometheus address is configured per-policy in AttunePolicy.spec.metricsSource.prometheus.address
# or globally via the AttuneDefaults CRD. It is NOT a chart value.

# -- Metrics endpoint
metrics:
  enabled: true
  port: 8080
  serviceMonitor:
    # -- Create a ServiceMonitor for Prometheus Operator
    enabled: false
    # -- Additional labels for the ServiceMonitor
    additionalLabels: {}
    # -- Scrape interval
    interval: 30s
  prometheusRule:
    # -- Create a PrometheusRule for out-of-the-box alerting.
    # Requires the Prometheus Operator CRDs (monitoring.coreos.com/v1).
    enabled: false
    # -- Additional labels for the PrometheusRule
    additionalLabels: {}
    # -- Override default alert rules. Each key matches a rule name;
    # set enabled: false to disable individual rules.
    rules:
      reconcileErrors:
        enabled: true
        # -- Error rate threshold (per second, averaged over 5m)
        threshold: "0"
        # -- How long the condition must persist before firing
        for: 10m
        severity: warning
      prometheusUnreachable:
        enabled: true
        for: 10m
        severity: warning
      degraded:
        enabled: true
        for: 5m
        severity: critical
      highRevertRate:
        enabled: true
        # -- Revert rate threshold (fraction, e.g. 0.5 = 50%)
        threshold: "0.5"
        # -- How long the condition must persist before firing
        for: 15m
        severity: critical
      reconcileStale:
        enabled: true
        # -- Fire when no reconcile completes within this duration
        staleDuration: 30m
        for: 5m
        severity: warning
      budgetExhausted:
        enabled: true
        # -- How long the condition must persist before firing
        for: 30m
        severity: warning
      dataQuality:
        enabled: true
        # -- How long the condition must persist before firing
        for: 30m
        severity: warning
      requestsClamped:
        enabled: true
        # -- How long the condition must persist before firing
        for: 1h
        severity: info
      staleRecommendations:
        enabled: true
        # -- How long the condition must persist before firing
        for: 1h
        severity: warning
      revertFailures:
        enabled: true
        # -- How long the condition must persist before firing
        for: 5m
        severity: critical
      podsInfeasible:
        # -- Fire when pods remain Infeasible for in-place resize
        enabled: true
        for: 30m
        severity: warning
      podsDeferred:
        # -- Fire when pods remain Deferred (node capacity) for in-place resize
        enabled: true
        for: 1h
        severity: warning
      gitopsPRFailures:
        # -- Fire when opt-in GitOps PR automation reports result=failed
        enabled: true
        for: 5m
        severity: warning
      memoryLimitUnsafe:
        # -- Fire when memory limit decreases are floored or skipped as unsafe
        enabled: true
        for: 1h
        severity: info
    # -- Recording rules for multi-cluster / federated Prometheus rollups (#369).
    # Safe to enable on single-cluster installs (cluster label may be empty).
    fleetRecordingRules:
      # -- Emit attune:* recording rules for org-wide Grafana and PromQL
      enabled: false

grafanaDashboard:
  # -- Create a ConfigMap with the Grafana dashboard (auto-discovered by Grafana sidecar)
  enabled: false
  # -- Additional labels for the dashboard ConfigMap (e.g., for folder selection)
  additionalLabels: {}

grafanaFleetDashboard:
  # -- Create a ConfigMap with the multi-cluster fleet Grafana dashboard (cluster variable).
  # Use with federated Prometheus that has external_labels.cluster on each scrape.
  enabled: false
  # -- Additional labels for the fleet dashboard ConfigMap
  additionalLabels: {}

# -- Optional per-cluster fleet summary ConfigMap for multi-cluster collectors (#369).
# Writes a versioned JSON report (schemaVersion v1) for scripts like
# scripts/collect-fleet-reports.sh.
fleetReport:
  # -- Enable periodic fleet report ConfigMap export (default off)
  enabled: false
  # -- ConfigMap name
  configMapName: attune-fleet-report
  # -- ConfigMap namespace (empty = release namespace)
  namespace: ""
  # -- Stable cluster id written into the report (e.g. prod-us-east-1)
  clusterId: ""
  # -- How often to refresh the report
  interval: 5m

# -- Webhook configuration (requires cert-manager installed in the cluster)
webhooks:
  # -- Enable admission webhooks for defaulting and validation. Requires cert-manager to be installed for TLS certificate provisioning.
  enabled: true

# -- Initial sizing webhook configuration.
# When enabled, a mutating webhook sets pod resource requests at creation time
# based on existing AttunePolicy recommendations. Requires namespace label
# attune.io/initial-sizing=enabled and initialSizing: true on the policy.
initialSizing:
  # -- Enable the pod initial sizing mutating webhook.
  enabled: false

# -- NetworkPolicy configuration for operator ingress and egress ports
networkPolicy:
  # -- Enable NetworkPolicy for the operator pod
  enabled: true
  # -- TCP port allowed by NetworkPolicy for Prometheus backend pods
  prometheusPort: 9090

# -- Cluster-wide defaults (creates an AttuneDefaults CR)
defaults:
  # -- Create an AttuneDefaults resource with the values below
  enabled: false
  # -- Prometheus metrics source defaults. Set `metricsSource.prometheus.address`
  # to share a Prometheus endpoint across all policies.
  # metricsSource:
  #   prometheus:
  #     address: "http://prometheus-server.monitoring:80"
  #   historyWindow: "168h"
  #   minimumDataPoints: 48
  #   queryStep: "5m"
  # -- CPU resource configuration defaults
  # cpu:
  #   percentile: 95
  #   overhead: "20"
  #   minAllowed: "50m"
  #   maxAllowed: "4000m"
  # -- Memory resource configuration defaults
  # memory:
  #   percentile: 99
  #   overhead: "30"
  #   minAllowed: "64Mi"
  #   maxAllowed: "8Gi"
  # -- Cost pricing defaults for savings estimates
  # costPricing:
  #   cpuPerCoreHour: "0.031"
  #   memoryPerGiBHour: "0.004"
  # -- When true (operator built-in default if unset), auto-exclude known
  # mesh/sidecar container names. Set false to restore exclude-only-via
  # excludedContainers for policies that leave the field unset.
  # excludeKnownSidecars: true
  # -- Default update strategy applied to all policies that don't override it
  updateStrategy:
    # -- Resize type: Observe, Recommend, OneShot, Canary, Auto
    type: Recommend
    # -- Cooldown between resize cycles (Go duration, minimum 1m)
    cooldown: "1h"
    # -- Auto-revert unsafe resizes
    autoRevert: true
    # -- Resize method: InPlaceOnly or InPlaceOrRecreate
    resizeMethod: InPlaceOnly
    # -- Max concurrent pod resizes per cycle (1-50)
    maxConcurrentResizes: 1
    # -- Schedule restrictions (optional)
    # schedule:
    #   windows:
    #     - start: "02:00"
    #       end: "06:00"
    #   daysOfWeek: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"]
    #   timezone: "UTC"
    # -- Per-cycle budget caps (optional)
    # maxTotalCpuIncrease: "2000m"
    # maxTotalMemoryIncrease: "4Gi"

# -- Cluster size preset: sets resources, rate limits, and replica count.
# Valid values: small, medium, large, xlarge, or "" (no preset).
# Any explicitly set value overrides the preset. See docs/guides/scaling.md for details.
clusterSize: ""

# -- Prometheus query rate limit (queries per second). Higher values reduce reconcile latency but increase Prometheus load.
prometheusQPS: 10

# -- Prometheus query burst allowance.
prometheusBurst: 20

# -- Collector cache TTL for unused Prometheus connections (Go duration, e.g. "10m", "1h")
collectorTTL: "10m"

# -- Maximum time for workload processing (including Prometheus queries) per reconciliation cycle (Go duration). If exceeded, partial results are used and the status condition indicates the timeout.
prometheusTimeout: "5m"

# -- Maximum number of AttunePolicy reconciles running in parallel.
# Empty uses binary default (2) or clusterSize presets (small=1, medium=2, large=4, xlarge=8).
maxConcurrentReconciles: ""

# -- Maximum parallel workers processing workloads within one AttunePolicy reconcile.
# Default 10. Raise for policies targeting many Deployments when prometheusQPS allows.
maxWorkloadWorkers: 10

# -- Cap pods named in metrics pod=~ regexes for huge Deployments (representative sample).
# Negative disables sampling. Default 100.
maxPodsInMetricsQuery: 100

# -- Operator ceiling for metrics historyWindow (Go duration). Empty = no extra clamp.
# clusterSize large/xlarge auto-set 72h/48h when this is empty.
maxHistoryWindow: ""

# -- Operator floor for metrics queryStep (Go duration). Empty = no extra clamp.
# clusterSize large/xlarge auto-set 10m/15m when this is empty.
minQueryStep: ""

# -- Minimum interval between Deferred/Infeasible blocker recomputes when not resizing.
# Zero recomputes every cycle. Default 5m.
blockerRefreshInterval: "5m"

# -- Maximum deterministic requeue jitter to spread policies that share a cooldown.
# Set to "0s" to disable. Default 2m (empty omits the flag and keeps the binary default).
requeueJitter: "2m"

# -- Cap samples passed into recommendation BuildProfile after downsampling.
# Negative disables. Default 10000.
maxProfileSamples: 10000

# -- Cap series kept from each Prometheus range query matrix.
# Zero uses the binary default (5000); negative disables. Default 5000.
maxPrometheusSeries: 5000

# -- Default cap for status.recommendations (full set still used for resizes).
maxStatusRecommendations: 100

# -- Write recommendation explanation chains into status (can bloat large policies).
statusIncludeExplanations: true

# -- Namespaces to watch for AttunePolicy resources. Empty means all namespaces (cluster-scoped).
# Set this to reduce informer cache memory on large clusters where policies exist in only a few
# namespaces. Cluster-scoped resources (Nodes, AttuneDefaults) are always watched regardless.
watchNamespaces: []

# -- FIPS 140-3 compliance mode.
# When enabled, sets GODEBUG=fips140=<mode> to activate Go's CMVP-validated
# cryptographic module (Certificate #5247). The binary always embeds the module;
# this toggle controls whether it is active at runtime.
fips:
  # -- Enable FIPS 140-3 mode
  enabled: false
  # -- FIPS enforcement level: "on" (approved algorithms preferred, fallbacks allowed)
  # or "only" (non-approved algorithms panic). Use "on" for Kubernetes operators
  # because client-go uses X25519 which is not FIPS-approved.
  mode: "on"

# -- OpenShift integration
openshift:
  # -- Enable OpenShift-specific features (TLS profile auto-detection).
  # When enabled, the ClusterRole includes read access to
  # config.openshift.io/apiservers for TLS security profile detection.
  enabled: false

# -- Logging configuration
logging:
  # -- Log level (debug, info, warn, error)
  level: info
  # -- Log format (json, text)
  format: json
