{{- if .Values.openshift.bindClusterMonitoringView }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "attune.fullname" . }}-cluster-monitoring-view
  labels:
    {{- include "attune.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
subjects:
  - kind: ServiceAccount
    name: {{ include "attune.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
