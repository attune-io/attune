apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: attune
  namespace: attune-system
  labels:
    app.kubernetes.io/name: attune
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: attune
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
      scheme: https
      authorization:
        type: Bearer
        credentialsFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        insecureSkipVerify: true