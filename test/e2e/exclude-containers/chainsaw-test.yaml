apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: exclude-containers
spec:
  description: >
    Verify excludedContainers omits the sidecar from status.recommendations
    while the app container is recommended
  timeouts:
    apply: 30s
    assert: 2m
    delete: 30s
  steps:
    - name: create-resources
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: e2e-exclude-containers
        - apply:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: multi-container-app
                namespace: e2e-exclude-containers
              spec:
                replicas: 1
                selector:
                  matchLabels:
                    app: multi-container-app
                template:
                  metadata:
                    labels:
                      app: multi-container-app
                  spec:
                    containers:
                      - name: app
                        image: registry.k8s.io/pause:3.9
                        resources:
                          requests:
                            cpu: 250m
                            memory: 256Mi
                          limits:
                            cpu: 500m
                            memory: 512Mi
                      - name: istio-proxy
                        image: registry.k8s.io/pause:3.9
                        resources:
                          requests:
                            cpu: 100m
                            memory: 128Mi
                          limits:
                            cpu: 200m
                            memory: 256Mi
        - apply:
            resource:
              apiVersion: attune.io/v1alpha1
              kind: AttunePolicy
              metadata:
                name: exclude-sidecar
                namespace: e2e-exclude-containers
              spec:
                targetRef:
                  kind: Deployment
                  name: multi-container-app
                excludedContainers:
                  - istio-proxy
                metricsSource:
                  prometheus:
                    address: http://prometheus-server.monitoring:80
                  minimumDataPoints: 1
                  historyWindow: 1h
                cpu:
                  percentile: 95
                  overhead: "20"
                memory:
                  percentile: 99
                  overhead: "30"
                updateStrategy:
                  type: Recommend
                  cooldown: 1m
    - name: verify-deployment-ready
      try:
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: multi-container-app
                namespace: e2e-exclude-containers
              status:
                readyReplicas: 1
    - name: verify-sidecar-excluded-from-recommendations
      try:
        - script:
            timeout: 3m
            content: |
              set -e
              for i in $(seq 1 36); do
                names=$(kubectl get attunepolicy exclude-sidecar -n e2e-exclude-containers \
                  -o jsonpath='{.status.recommendations[*].containers[*].name}' 2>/dev/null || true)
                recs=$(kubectl get attunepolicy exclude-sidecar -n e2e-exclude-containers \
                  -o jsonpath='{.status.workloads.withRecommendations}' 2>/dev/null || true)
                if echo " $names " | grep -q ' istio-proxy '; then
                  echo "FAIL: excluded sidecar appeared in recommendations: $names"
                  kubectl get attunepolicy exclude-sidecar -n e2e-exclude-containers -o yaml
                  exit 1
                fi
                if [ "${recs:-0}" -ge 1 ] 2>/dev/null && echo " $names " | grep -q ' app '; then
                  echo "OK: recommendations include app only (names='$names')"
                  exit 0
                fi
                echo "Waiting... recs=$recs names='$names'"
                sleep 5
              done
              echo "FAIL: timed out waiting for app-only recommendations"
              kubectl get attunepolicy exclude-sidecar -n e2e-exclude-containers -o yaml
              exit 1
  catch:
    - describe:
        apiVersion: attune.io/v1alpha1
        kind: AttunePolicy
        namespace: e2e-exclude-containers
    - podLogs:
        namespace: attune-system
        selector: app.kubernetes.io/name=attune
