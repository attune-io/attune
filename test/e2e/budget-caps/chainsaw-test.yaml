apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: budget-caps
spec:
  description: >
    Verify maxTotalCpuIncrease gates multi-pod CPU increases in one cycle.
    Two CPU-burn pods start at 50m with maxAllowed 100m (~50m increase each).
    A 70m cycle budget allows one pod; the second stays at 50m. Long cooldown
    freezes further cycles so the assertion is stable.
  timeouts:
    apply: 30s
    assert: 2m
    delete: 30s
  steps:
    - name: create-deployment
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: e2e-budget-caps
        - apply:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: budget-app
                namespace: e2e-budget-caps
              spec:
                replicas: 2
                selector:
                  matchLabels:
                    app: budget-app
                template:
                  metadata:
                    labels:
                      app: budget-app
                  spec:
                    containers:
                      - name: app
                        image: docker.io/library/busybox:1.37
                        command: ["sh", "-c", "while true; do :; done"]
                        resizePolicy:
                          - resourceName: cpu
                            restartPolicy: NotRequired
                          - resourceName: memory
                            restartPolicy: NotRequired
                        resources:
                          requests:
                            cpu: 50m
                            memory: 32Mi
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: budget-app
                namespace: e2e-budget-caps
              status:
                readyReplicas: 2
    - name: wait-for-metrics
      try:
        - script:
            timeout: 2m
            content: |
              PROM_POD=$(kubectl get pods -n monitoring -l app.kubernetes.io/name=prometheus,app.kubernetes.io/component=server -o name | head -1)
              NS="e2e-budget-caps"
              ENCODED_QUERY="container_cpu_usage_seconds_total%7Bnamespace%3D%22${NS}%22%2Ccontainer%21%3D%22%22%7D"
              for i in $(seq 1 24); do
                result=$(kubectl exec -n monitoring "$PROM_POD" -- \
                  wget -qO- "http://localhost:9090/api/v1/query?query=${ENCODED_QUERY}" 2>/dev/null || true)
                if echo "$result" | grep -q '"result":\[{'; then
                  echo "cAdvisor metrics available for namespace $NS after ${i}x5s"
                  exit 0
                fi
                sleep 5
              done
              echo "WARNING: No cAdvisor metrics for $NS after 120s, proceeding"
    - name: create-policy
      try:
        - apply:
            resource:
              apiVersion: attune.io/v1alpha1
              kind: AttunePolicy
              metadata:
                name: budget-test
                namespace: e2e-budget-caps
              spec:
                targetRef:
                  kind: Deployment
                  name: budget-app
                metricsSource:
                  prometheus:
                    address: http://prometheus-server.monitoring:80
                  minimumDataPoints: 1
                  historyWindow: 1h
                  queryStep: 30s
                  rateWindow: 5m
                cpu:
                  percentile: 95
                  overhead: "20"
                  minAllowed: 50m
                  maxAllowed: 100m
                  maxChangePercent: 100
                memory:
                  percentile: 99
                  overhead: "30"
                  allowDecrease: true
                  minAllowed: 32Mi
                  maxAllowed: 256Mi
                  maxChangePercent: 100
                updateStrategy:
                  type: Auto
                  cooldown: 2h
                  autoRevert: false
                  maxConcurrentResizes: 2
                  maxTotalCpuIncrease: "70m"
    - name: verify-budget-gates-second-pod
      try:
        - script:
            timeout: 5m
            content: |
              NS="e2e-budget-caps"
              POL="budget-test"
              # Wait for at least one resize under the budget.
              for i in $(seq 1 60); do
                RESIZED=$(kubectl get attunepolicy "$POL" -n "$NS" \
                  -o jsonpath='{.status.workloads.resized}' 2>/dev/null)
                if [ "$RESIZED" -ge 1 ] 2>/dev/null; then
                  echo "resize landed: resized=$RESIZED"
                  break
                fi
                sleep 5
              done
              RESIZED=$(kubectl get attunepolicy "$POL" -n "$NS" \
                -o jsonpath='{.status.workloads.resized}' 2>/dev/null)
              if [ -z "$RESIZED" ] || [ "$RESIZED" -lt 1 ] 2>/dev/null; then
                echo "FAIL: expected workloads.resized>=1 under 70m CPU increase budget"
                kubectl get attunepolicy "$POL" -n "$NS" -o yaml
                exit 1
              fi
              # status.workloads.resized is a workload count (1 if any pod
              # resized), not a pod count. Gate proof is pod-level.
              STILL=0
              MOVED=0
              for cpu in $(kubectl get pods -n "$NS" -l app=budget-app \
                -o jsonpath='{range .items[*]}{.spec.containers[0].resources.requests.cpu}{"\n"}{end}'); do
                if [ "$cpu" = "50m" ]; then
                  STILL=$((STILL + 1))
                else
                  MOVED=$((MOVED + 1))
                fi
              done
              EXHAUSTED=$(kubectl get events -n "$NS" \
                --field-selector reason=BudgetExhausted 2>/dev/null | grep -c budget-test || true)
              echo "pods still at 50m: $STILL moved: $MOVED BudgetExhausted lines: $EXHAUSTED"
              if [ "$MOVED" -gt 1 ]; then
                echo "FAIL: more than one pod left 50m; budget should allow only one ~50m increase"
                kubectl get pods -n "$NS" -l app=budget-app -o yaml
                exit 1
              fi
              if [ "$STILL" -ge 1 ] || [ "$EXHAUSTED" -ge 1 ]; then
                echo "OK: budget gated multi-pod increase"
                exit 0
              fi
              echo "FAIL: expected a pod still at 50m or BudgetExhausted"
              kubectl get pods -n "$NS" -l app=budget-app -o yaml
              kubectl get attunepolicy "$POL" -n "$NS" -o yaml
              exit 1
  catch:
    - describe:
        apiVersion: attune.io/v1alpha1
        kind: AttunePolicy
        namespace: e2e-budget-caps
    - podLogs:
        namespace: attune-system
        selector: app.kubernetes.io/name=attune
