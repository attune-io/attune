apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: runtime-profile-defaults
spec:
  description: >
    Live path for runtimeProfile: field is stored, java+allowDecrease=true
    produces an admission warning, and java profile is accepted for reconcile.
    In-memory defaults (allowDecrease=false, overhead=40 for java) are applied
    in the controller (pkg/defaults), not mutated onto the stored CR by the
    webhook (see webhook-defaulting). Unit tests cover ApplyRuntimeProfileDefaults.
  timeouts:
    apply: 30s
    assert: 3m
    delete: 30s
  steps:
    - name: create-namespace
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: e2e-runtime-profile
    - name: create-workload
      try:
        - apply:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: java-app
                namespace: e2e-runtime-profile
              spec:
                replicas: 1
                selector:
                  matchLabels:
                    app: java-app
                template:
                  metadata:
                    labels:
                      app: java-app
                  spec:
                    containers:
                      - name: app
                        image: registry.k8s.io/pause:3.9
                        resources:
                          requests:
                            cpu: 500m
                            memory: 512Mi
    - name: admission-warns-java-allow-decrease
      try:
        - script:
            timeout: 30s
            content: |
              # Server-side dry-run surfaces validating webhook warnings on stderr.
              # Write policy JSON without nested YAML heredocs (breaks outer Chainsaw YAML).
              printf '%s\n' '{"apiVersion":"attune.io/v1alpha1","kind":"AttunePolicy","metadata":{"name":"java-warn","namespace":"e2e-runtime-profile"},"spec":{"runtimeProfile":"java","targetRef":{"kind":"Deployment","name":"java-app"},"metricsSource":{"prometheus":{"address":"http://prometheus-server.monitoring:80"},"minimumDataPoints":1},"cpu":{"percentile":95},"memory":{"percentile":99,"allowDecrease":true},"updateStrategy":{"type":"Recommend","cooldown":"1m"}}}' > /tmp/attune-java-warn.json
              set +e
              OUT=$(kubectl apply --dry-run=server -o name -f /tmp/attune-java-warn.json 2>&1)
              RC=$?
              set -e
              echo "$OUT"
              if [ $RC -ne 0 ]; then
                echo "FAIL: dry-run apply failed rc=$RC"
                exit 1
              fi
              echo "$OUT" | grep -q 'runtimeProfile=java' || {
                echo "FAIL: expected admission warning mentioning runtimeProfile=java"
                exit 1
              }
              echo "OK: admission warning for java + allowDecrease"
    - name: create-java-policy
      try:
        - apply:
            resource:
              apiVersion: attune.io/v1alpha1
              kind: AttunePolicy
              metadata:
                name: java-profile
                namespace: e2e-runtime-profile
              spec:
                runtimeProfile: java
                targetRef:
                  kind: Deployment
                  name: java-app
                metricsSource:
                  prometheus:
                    address: http://prometheus-server.monitoring:80
                  minimumDataPoints: 1
                  historyWindow: 1h
                cpu:
                  percentile: 95
                memory:
                  percentile: 99
                updateStrategy:
                  type: Recommend
                  cooldown: 1m
        - assert:
            resource:
              apiVersion: attune.io/v1alpha1
              kind: AttunePolicy
              metadata:
                name: java-profile
                namespace: e2e-runtime-profile
              spec:
                runtimeProfile: java
    - name: verify-java-policy-ready-or-monitoring
      try:
        - script:
            timeout: 3m
            content: |
              NS=e2e-runtime-profile
              POL=java-profile
              for i in $(seq 1 36); do
                reason=$(kubectl -n "$NS" get attunepolicy "$POL" \
                  -o jsonpath='{range .status.conditions[?(@.type=="Ready")]}{.reason}{end}' 2>/dev/null || true)
                if [ "$reason" = "Monitoring" ] || [ "$reason" = "InsufficientData" ] || [ "$reason" = "Ready" ]; then
                  profile=$(kubectl -n "$NS" get attunepolicy "$POL" -o jsonpath='{.spec.runtimeProfile}')
                  if [ "$profile" != "java" ]; then
                    echo "FAIL: runtimeProfile want java got '$profile'"
                    exit 1
                  fi
                  oh=$(kubectl -n "$NS" get attunepolicy "$POL" -o jsonpath='{.spec.memory.overhead}')
                  ad=$(kubectl -n "$NS" get attunepolicy "$POL" -o jsonpath='{.spec.memory.allowDecrease}')
                  echo "OK: Ready reason=$reason runtimeProfile=$profile stored overhead='$oh' allowDecrease='$ad' (controller applies java defaults in-memory)"
                  exit 0
                fi
                sleep 5
              done
              echo "FAIL: policy did not converge"
              kubectl -n "$NS" get attunepolicy "$POL" -o yaml || true
              exit 1
    - name: golang-allow-decrease-no-java-warning
      try:
        - script:
            timeout: 30s
            content: |
              printf '%s\n' '{"apiVersion":"attune.io/v1alpha1","kind":"AttunePolicy","metadata":{"name":"golang-ok","namespace":"e2e-runtime-profile"},"spec":{"runtimeProfile":"golang","targetRef":{"kind":"Deployment","name":"java-app"},"metricsSource":{"prometheus":{"address":"http://prometheus-server.monitoring:80"},"minimumDataPoints":1},"cpu":{"percentile":95},"memory":{"percentile":99,"allowDecrease":true},"updateStrategy":{"type":"Recommend","cooldown":"1m"}}}' > /tmp/attune-golang-ok.json
              set +e
              OUT=$(kubectl apply --dry-run=server -o name -f /tmp/attune-golang-ok.json 2>&1)
              RC=$?
              set -e
              echo "$OUT"
              if [ $RC -ne 0 ]; then
                echo "FAIL: golang dry-run failed"
                exit 1
              fi
              if echo "$OUT" | grep -q 'runtimeProfile=java'; then
                echo "FAIL: unexpected java warning on golang profile"
                exit 1
              fi
              if echo "$OUT" | grep -q 'runtimeProfile=golang recommends against'; then
                echo "FAIL: golang should not warn on allowDecrease"
                exit 1
              fi
              echo "OK: golang + allowDecrease has no runtimeProfile decrease warning"
  catch:
    - describe:
        apiVersion: attune.io/v1alpha1
        kind: AttunePolicy
        namespace: e2e-runtime-profile
    - podLogs:
        namespace: attune-system
        selector: app.kubernetes.io/name=attune
