apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: daemonset-auto-resize
spec:
  description: Auto mode resizes the current revision of a RollingUpdate DaemonSet
  timeouts:
    apply: 30s
    assert: 5m
    delete: 30s
  steps:
    - name: create-daemonset
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: e2e-daemonset-auto
        - apply:
            resource:
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: log-agent
                namespace: e2e-daemonset-auto
                labels:
                  app: log-agent
              spec:
                selector:
                  matchLabels:
                    app: log-agent
                template:
                  metadata:
                    labels:
                      app: log-agent
                  spec:
                    containers:
                      - name: agent
                        image: registry.k8s.io/pause:3.9
                        resizePolicy:
                          - resourceName: cpu
                            restartPolicy: NotRequired
                          - resourceName: memory
                            restartPolicy: NotRequired
                        resources:
                          requests:
                            cpu: 200m
                            memory: 128Mi
        - assert:
            resource:
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: log-agent
                namespace: e2e-daemonset-auto
              status:
                numberReady: 1
    - name: wait-for-metrics
      try:
        - script:
            timeout: 2m
            content: |
              PROM_POD=$(kubectl get pods -n monitoring -l app.kubernetes.io/name=prometheus,app.kubernetes.io/component=server -o name | head -1)
              NS="e2e-daemonset-auto"
              ENCODED_QUERY="container_cpu_usage_seconds_total%7Bnamespace%3D%22${NS}%22%2Ccontainer%21%3D%22%22%7D"
              for i in $(seq 1 24); do
                result=$(kubectl exec -n monitoring "$PROM_POD" -- \
                  wget -qO- "http://localhost:9090/api/v1/query?query=${ENCODED_QUERY}" 2>/dev/null || true)
                if echo "$result" | grep -q '"result":\[{'; then
                  echo "cAdvisor metrics available for namespace $NS after ${i}x5s"
                  exit 0
                fi
                sleep 5
              done
              echo "WARNING: No cAdvisor metrics for $NS after 120s, proceeding"
    - name: create-policy
      try:
        - apply:
            resource:
              apiVersion: attune.io/v1alpha1
              kind: AttunePolicy
              metadata:
                name: daemonset-auto
                namespace: e2e-daemonset-auto
              spec:
                targetRef:
                  kind: DaemonSet
                  name: log-agent
                metricsSource:
                  prometheus:
                    address: http://prometheus-server.monitoring:80
                  minimumDataPoints: 1
                  historyWindow: 1h
                  queryStep: 1m
                  rateWindow: 5m
                cpu:
                  percentile: 95
                  overhead: "20"
                  minAllowed: 50m
                  maxAllowed: 100m
                  maxChangePercent: 100
                memory:
                  percentile: 99
                  overhead: "30"
                  allowDecrease: true
                  minAllowed: 64Mi
                  maxAllowed: 256Mi
                  maxChangePercent: 100
                updateStrategy:
                  type: Auto
                  cooldown: 1m
                  autoRevert: true
    - name: verify-current-revision-resized
      try:
        - script:
            timeout: 5m
            content: |
              set -e
              cpu_milli() {
                v=$1
                case "$v" in
                  *m) echo "${v%m}" ;;
                  "") echo 0 ;;
                  *) echo $((v * 1000)) ;;
                esac
              }
              NS="e2e-daemonset-auto"
              for i in $(seq 1 60); do
                CPU=$(kubectl get pods -n "$NS" -l app=log-agent \
                  -o jsonpath='{.items[0].spec.containers[0].resources.requests.cpu}' 2>/dev/null || true)
                HASH=$(kubectl get pods -n "$NS" -l app=log-agent \
                  -o jsonpath='{.items[0].metadata.labels.controller-revision-hash}' 2>/dev/null || true)
                milli=$(cpu_milli "$CPU")
                if [ "$milli" -gt 0 ] && [ "$milli" -lt 200 ] && [ -n "$HASH" ]; then
                  echo "Current DaemonSet pod resized: cpu=$CPU hash=$HASH"
                  exit 0
                fi
                echo "Waiting... cpu=$CPU milli=$milli hash=$HASH"
                sleep 5
              done
              echo "DaemonSet pod was not resized below 200m"
              kubectl get pods -n "$NS" -l app=log-agent --show-labels
              kubectl get controllerrevision -n "$NS"
              kubectl get attunepolicy daemonset-auto -n "$NS" -o yaml
              exit 1
  catch:
    - describe:
        apiVersion: attune.io/v1alpha1
        kind: AttunePolicy
        namespace: e2e-daemonset-auto
    - describe:
        apiVersion: apps/v1
        kind: DaemonSet
        namespace: e2e-daemonset-auto
    - podLogs:
        namespace: attune-system
        selector: app.kubernetes.io/name=attune
