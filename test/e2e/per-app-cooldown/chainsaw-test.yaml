apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: per-app-cooldown
spec:
  description: >
    Create app-b only after app-a's first Success. Per-app cooldown
    must still resize app-b in under 60s. A policy-wide stamp would
    wait the full 1m.
  timeouts:
    apply: 30s
    assert: 2m
    delete: 30s
  steps:
    - name: create-apps
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: e2e-per-app-cooldown
        - apply:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: app-a
                namespace: e2e-per-app-cooldown
                labels:
                  app: app-a
                  tier: api
              spec:
                replicas: 1
                selector:
                  matchLabels:
                    app: app-a
                template:
                  metadata:
                    labels:
                      app: app-a
                      tier: api
                  spec:
                    containers:
                      - name: app
                        image: registry.k8s.io/pause:3.9
                        resizePolicy:
                          - resourceName: cpu
                            restartPolicy: NotRequired
                          - resourceName: memory
                            restartPolicy: NotRequired
                        resources:
                          requests:
                            cpu: 100m
                            memory: 256Mi
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: app-a
                namespace: e2e-per-app-cooldown
              status:
                readyReplicas: 1
    - name: wait-for-metrics
      try:
        - script:
            timeout: 2m
            content: |
              PROM_POD=$(kubectl get pods -n monitoring -l app.kubernetes.io/name=prometheus,app.kubernetes.io/component=server -o name | head -1)
              NS="e2e-per-app-cooldown"
              ENCODED_QUERY="container_cpu_usage_seconds_total%7Bnamespace%3D%22${NS}%22%2Ccontainer%21%3D%22%22%7D"
              for i in $(seq 1 24); do
                result=$(kubectl exec -n monitoring "$PROM_POD" -- \
                  wget -qO- "http://localhost:9090/api/v1/query?query=${ENCODED_QUERY}" 2>/dev/null || true)
                if echo "$result" | grep -q '"result":\[{'; then
                  echo "cAdvisor metrics available for namespace $NS after ${i}x5s"
                  exit 0
                fi
                sleep 5
              done
              echo "WARNING: No cAdvisor metrics for $NS after 120s, proceeding"
    - name: create-policy
      try:
        - apply:
            resource:
              apiVersion: attune.io/v1alpha1
              kind: AttunePolicy
              metadata:
                name: fleet-auto
                namespace: e2e-per-app-cooldown
              spec:
                targetRef:
                  kind: Deployment
                  selector:
                    matchLabels:
                      tier: api
                metricsSource:
                  prometheus:
                    address: http://prometheus-server.monitoring:80
                  minimumDataPoints: 1
                  historyWindow: 1h
                  queryStep: 1m
                  rateWindow: 5m
                cpu:
                  percentile: 95
                  overhead: "20"
                  minAllowed: 50m
                  maxAllowed: "4000m"
                  maxChangePercent: 100
                memory:
                  percentile: 99
                  overhead: "30"
                  allowDecrease: true
                  minAllowed: 64Mi
                  maxAllowed: 8Gi
                  maxChangePercent: 100
                updateStrategy:
                  type: Auto
                  cooldown: 1m
                  maxConcurrentResizes: 1
    - name: wait-app-a-success
      try:
        - script:
            timeout: 5m
            content: |
              NS=e2e-per-app-cooldown
              for i in $(seq 1 60); do
                kubectl get attunepolicy fleet-auto -n "$NS" -o json \
                  > /tmp/fleet-auto.json 2>/dev/null || true
                python3 <<'PY'
              import json
              import sys
              try:
                  p = json.load(open("/tmp/fleet-auto.json"))
              except Exception:
                  sys.exit(1)
              for h in (p.get("status") or {}).get("resizeHistory") or []:
                  if h.get("result") == "Success" and h.get("workload") == "app-a":
                      print(h.get("timestamp"))
                      sys.exit(0)
              sys.exit(1)
              PY
                if [ $? -eq 0 ]; then
                  echo "app-a Success recorded"
                  exit 0
                fi
                sleep 5
              done
              echo "FAIL: no Success history for app-a"
              kubectl get attunepolicy fleet-auto -n "$NS" -o yaml
              exit 1
    - name: apply-app-b
      try:
        - apply:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: app-b
                namespace: e2e-per-app-cooldown
                labels:
                  app: app-b
                  tier: api
              spec:
                replicas: 1
                selector:
                  matchLabels:
                    app: app-b
                template:
                  metadata:
                    labels:
                      app: app-b
                      tier: api
                  spec:
                    containers:
                      - name: app
                        image: registry.k8s.io/pause:3.9
                        resizePolicy:
                          - resourceName: cpu
                            restartPolicy: NotRequired
                          - resourceName: memory
                            restartPolicy: NotRequired
                        resources:
                          requests:
                            cpu: 100m
                            memory: 256Mi
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: app-b
                namespace: e2e-per-app-cooldown
              status:
                readyReplicas: 1
    - name: verify-app-b-resized-inside-cooldown
      try:
        - script:
            timeout: 90s
            content: |
              NS=e2e-per-app-cooldown
              for i in $(seq 1 18); do
                kubectl get attunepolicy fleet-auto -n "$NS" -o json \
                  > /tmp/fleet-auto.json 2>/dev/null || true
                python3 <<'PY'
              import json
              import sys
              from datetime import datetime
              try:
                  p = json.load(open("/tmp/fleet-auto.json"))
              except Exception:
                  sys.exit(3)
              first = {}
              for h in (p.get("status") or {}).get("resizeHistory") or []:
                  if h.get("result") != "Success":
                      continue
                  w = h.get("workload")
                  ts = h.get("timestamp")
                  if w and ts and w not in first:
                      first[w] = ts
              if "app-a" not in first or "app-b" not in first:
                  sys.exit(3)
              def parse(s):
                  return datetime.fromisoformat(s.replace("Z", "+00:00"))
              ta = parse(first["app-a"])
              tb = parse(first["app-b"])
              delta = (tb - ta).total_seconds()
              print("first Success app-a=%s app-b=%s delta=%.1fs" % (
                  first["app-a"], first["app-b"], delta))
              if delta < 0:
                  sys.exit(4)
              if delta >= 60:
                  sys.exit(2)
              sys.exit(0)
              PY
                rc=$?
                if [ "$rc" -eq 0 ]; then
                  echo "OK: app-b resized after app-a and inside 60s"
                  exit 0
                fi
                if [ "$rc" -eq 2 ]; then
                  echo "FAIL: app-b first Success is >= 60s after app-a"
                  kubectl get attunepolicy fleet-auto -n "$NS" -o yaml
                  exit 1
                fi
                if [ "$rc" -eq 4 ]; then
                  echo "FAIL: app-b Success is before app-a"
                  kubectl get attunepolicy fleet-auto -n "$NS" -o yaml
                  exit 1
                fi
                sleep 5
              done
              echo "FAIL: no Success history for app-b inside 90s"
              kubectl get attunepolicy fleet-auto -n "$NS" -o yaml
              exit 1
  catch:
    - describe:
        apiVersion: attune.io/v1alpha1
        kind: AttunePolicy
        namespace: e2e-per-app-cooldown
    - describe:
        apiVersion: apps/v1
        kind: Deployment
        namespace: e2e-per-app-cooldown
    - podLogs:
        namespace: attune-system
        selector: app.kubernetes.io/name=attune
