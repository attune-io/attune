apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: hpa-conflict
spec:
  description: Verify that an AttunePolicy coexists with an HPA on the same Deployment (warning only, not blocking)
  timeouts:
    apply: 30s
    assert: 2m
    delete: 30s
  steps:
    - name: create-resources
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: e2e-hpa-conflict
        - apply:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: hpa-app
                namespace: e2e-hpa-conflict
              spec:
                replicas: 2
                selector:
                  matchLabels:
                    app: hpa-app
                template:
                  metadata:
                    labels:
                      app: hpa-app
                  spec:
                    containers:
                      - name: app
                        image: registry.k8s.io/pause:3.9
                        resources:
                          requests:
                            cpu: 100m
                            memory: 128Mi
                          limits:
                            cpu: 200m
                            memory: 256Mi
        - apply:
            resource:
              apiVersion: autoscaling/v2
              kind: HorizontalPodAutoscaler
              metadata:
                name: hpa-app
                namespace: e2e-hpa-conflict
              spec:
                scaleTargetRef:
                  apiVersion: apps/v1
                  kind: Deployment
                  name: hpa-app
                minReplicas: 2
                maxReplicas: 10
                metrics:
                  - type: Resource
                    resource:
                      name: cpu
                      target:
                        type: Utilization
                        averageUtilization: 70
        - apply:
            resource:
              apiVersion: attune.io/v1alpha1
              kind: AttunePolicy
              metadata:
                name: hpa-conflict-test
                namespace: e2e-hpa-conflict
              spec:
                targetRef:
                  kind: Deployment
                  name: hpa-app
                metricsSource:
                  prometheus:
                    address: http://prometheus-server.monitoring:80
                  minimumDataPoints: 1
                  historyWindow: 1h
                cpu:
                  percentile: 95
                  overhead: "20"
                memory:
                  percentile: 99
                  overhead: "30"
                updateStrategy:
                  type: Recommend
                  cooldown: 1m
    - name: verify-deployment-ready
      try:
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: hpa-app
                namespace: e2e-hpa-conflict
              status:
                readyReplicas: 2
    - name: verify-hpa-conflict-warning
      try:
        - script:
            timeout: 3m
            content: |
              set -e
              for i in $(seq 1 36); do
                discovered=$(kubectl get attunepolicy hpa-conflict-test -n e2e-hpa-conflict \
                  -o jsonpath='{.status.workloads.discovered}' 2>/dev/null || true)
                events=$(kubectl get events -n e2e-hpa-conflict \
                  --field-selector involvedObject.name=hpa-conflict-test,involvedObject.kind=AttunePolicy,reason=HPAConflict \
                  -o jsonpath='{.items[*].reason}' 2>/dev/null || true)
                if [ "$discovered" = "1" ] && echo "$events" | grep -q HPAConflict; then
                  echo "OK: discovered=1 and HPAConflict warning event present"
                  exit 0
                fi
                echo "Waiting... discovered=$discovered events='$events'"
                sleep 5
              done
              echo "FAIL: timed out waiting for HPAConflict event with discovered=1"
              kubectl get attunepolicy hpa-conflict-test -n e2e-hpa-conflict -o yaml
              kubectl get events -n e2e-hpa-conflict --sort-by='.lastTimestamp' | tail -20
              exit 1
  catch:
    - describe:
        apiVersion: attune.io/v1alpha1
        kind: AttunePolicy
        namespace: e2e-hpa-conflict
    - describe:
        apiVersion: autoscaling/v2
        kind: HorizontalPodAutoscaler
        namespace: e2e-hpa-conflict
    - podLogs:
        namespace: attune-system
        selector: app.kubernetes.io/name=attune
