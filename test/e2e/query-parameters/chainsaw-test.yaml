apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: query-parameters
spec:
  description: Verify that queryParameters on PrometheusConfig are accepted and do not break query execution
  timeouts:
    apply: 30s
    assert: 2m
    delete: 30s
  steps:
    - name: create-resources
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: e2e-query-parameters
        - apply:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: qp-app
                namespace: e2e-query-parameters
              spec:
                replicas: 1
                selector:
                  matchLabels:
                    app: qp-app
                template:
                  metadata:
                    labels:
                      app: qp-app
                  spec:
                    containers:
                      - name: app
                        image: registry.k8s.io/pause:3.9
                        resources:
                          requests:
                            cpu: 100m
                            memory: 128Mi
        - apply:
            resource:
              apiVersion: attune.io/v1alpha1
              kind: AttunePolicy
              metadata:
                name: qp-test
                namespace: e2e-query-parameters
              spec:
                targetRef:
                  kind: Deployment
                  name: qp-app
                metricsSource:
                  prometheus:
                    address: http://prometheus-server.monitoring:80
                    queryParameters:
                      dedup: "true"
                      partial_response: "true"
                  minimumDataPoints: 1
                  historyWindow: 1h
                cpu:
                  percentile: 95
                  overhead: "20"
                memory:
                  percentile: 99
                  overhead: "30"
                updateStrategy:
                  type: Recommend
                  cooldown: 1m
    - name: verify-deployment-ready
      try:
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: qp-app
                namespace: e2e-query-parameters
              status:
                readyReplicas: 1
    - name: verify-query-parameters-still-produce-recommendations
      try:
        - script:
            timeout: 3m
            content: |
              set -e
              for i in $(seq 1 36); do
                recs=$(kubectl get attunepolicy qp-test -n e2e-query-parameters \
                  -o jsonpath='{.status.workloads.withRecommendations}' 2>/dev/null || true)
                if [ "${recs:-0}" -ge 1 ] 2>/dev/null; then
                  echo "OK: queryParameters still allow recommendations (withRecommendations=$recs)"
                  exit 0
                fi
                echo "Waiting... withRecommendations=$recs"
                sleep 5
              done
              echo "FAIL: timed out waiting for recommendations with queryParameters"
              kubectl get attunepolicy qp-test -n e2e-query-parameters -o yaml
              exit 1
  catch:
    - describe:
        apiVersion: attune.io/v1alpha1
        kind: AttunePolicy
        namespace: e2e-query-parameters
    - podLogs:
        namespace: attune-system
        selector: app.kubernetes.io/name=attune
