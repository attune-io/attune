apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: defaults-validation
spec:
  description: Verify that the AttuneDefaults validation webhook rejects invalid costPricing values
  timeouts:
    apply: 30s
    assert: 1m
    delete: 30s
  steps:
    - name: valid-defaults-accepted
      try:
        - apply:
            resource:
              apiVersion: attune.io/v1alpha1
              kind: AttuneDefaults
              metadata:
                name: e2e-valid
              spec:
                costPricing:
                  cpuPerCoreHour: "0.05"
                  memoryPerGiBHour: "0.01"
        - assert:
            resource:
              apiVersion: attune.io/v1alpha1
              kind: AttuneDefaults
              metadata:
                name: e2e-valid
      catch:
        - podLogs:
            selector: app.kubernetes.io/name=attune
            namespace: attune-system
            tail: 20

    - name: invalid-cpu-price-rejected
      try:
        - script:
            content: |
              # This should be rejected by the webhook
              cat <<'EOF' | kubectl apply -f - 2>/dev/null && { echo "ERROR: invalid costPricing should have been rejected"; exit 1; }
              apiVersion: attune.io/v1alpha1
              kind: AttuneDefaults
              metadata:
                name: e2e-invalid-cpu
              spec:
                costPricing:
                  cpuPerCoreHour: "banana"
              EOF
              echo "Correctly rejected invalid cpuPerCoreHour"

    - name: negative-memory-price-rejected
      try:
        - script:
            content: |
              cat <<'EOF' | kubectl apply -f - 2>/dev/null && { echo "ERROR: negative memoryPerGiBHour should have been rejected"; exit 1; }
              apiVersion: attune.io/v1alpha1
              kind: AttuneDefaults
              metadata:
                name: e2e-invalid-mem
              spec:
                costPricing:
                  memoryPerGiBHour: "-0.5"
              EOF
              echo "Correctly rejected negative memoryPerGiBHour"

    - name: deprecated-cluster-bearer-token-warns
      description: >
        bearerTokenSecret on cluster AttuneDefaults is accepted with an
        admission warning. Name zzz-* so this object does not win
        fetchDefaults (lexicographically smallest name).
      try:
        - script:
            timeout: 30s
            content: |
              set -e
              cat > /tmp/zzz-e2e-deprecated-bearer.yaml <<'YAML'
              apiVersion: attune.io/v1alpha1
              kind: AttuneDefaults
              metadata:
                name: zzz-e2e-deprecated-bearer
              spec:
                metricsSource:
                  prometheus:
                    address: http://prometheus-server.monitoring:80
                    bearerTokenSecret:
                      name: attune-thanos-token
                      key: token
              YAML
              set +e
              out=$(kubectl apply -f /tmp/zzz-e2e-deprecated-bearer.yaml 2>&1)
              rc=$?
              set -e
              if [ "$rc" -ne 0 ]; then
                echo "FAIL: deprecated AttuneDefaults bearerTokenSecret was rejected"
                echo "$out"
                exit 1
              fi
              echo "$out" | grep -q 'bearerTokenSecret on AttuneDefaults is deprecated'
              echo "OK: admission warned on cluster AttuneDefaults bearerTokenSecret"

    - name: cleanup
      try:
        - script:
            content: |
              kubectl delete attunedefaults e2e-valid --ignore-not-found
              kubectl delete attunedefaults e2e-invalid-cpu --ignore-not-found
              kubectl delete attunedefaults e2e-invalid-mem --ignore-not-found
              kubectl delete attunedefaults zzz-e2e-deprecated-bearer --ignore-not-found
