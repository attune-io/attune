apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: canary-rollout
spec:
  description: Verify that an AttunePolicy in Canary mode with 33% percentage reaches Ready condition
  timeouts:
    apply: 30s
    assert: 2m
    delete: 30s
  steps:
    - name: create-deployment
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: e2e-canary-rollout
        - apply:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: canary-app
                namespace: e2e-canary-rollout
                labels:
                  app: canary-app
                  tier: api
              spec:
                replicas: 3
                selector:
                  matchLabels:
                    app: canary-app
                template:
                  metadata:
                    labels:
                      app: canary-app
                      tier: api
                  spec:
                    containers:
                      - name: app
                        image: registry.k8s.io/pause:3.9
                        resizePolicy:
                          - resourceName: cpu
                            restartPolicy: NotRequired
                          - resourceName: memory
                            restartPolicy: NotRequired
                        resources:
                          requests:
                            cpu: 500m
                            memory: 512Mi
                          limits:
                            cpu: "1"
                            memory: 1Gi
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: canary-app
                namespace: e2e-canary-rollout
              status:
                readyReplicas: 3
    - name: wait-for-metrics
      try:
        - script:
            timeout: 2m
            content: |
              PROM_POD=$(kubectl get pods -n monitoring -l app.kubernetes.io/name=prometheus,app.kubernetes.io/component=server -o name | head -1)
              NS="e2e-canary-rollout"
              ENCODED_QUERY="container_cpu_usage_seconds_total%7Bnamespace%3D%22${NS}%22%2Ccontainer%21%3D%22%22%7D"
              for i in $(seq 1 24); do
                result=$(kubectl exec -n monitoring "$PROM_POD" -- \
                  wget -qO- "http://localhost:9090/api/v1/query?query=${ENCODED_QUERY}" 2>/dev/null || true)
                if echo "$result" | grep -q '"result":\[{'; then
                  echo "cAdvisor metrics available for namespace $NS after ${i}x5s"
                  exit 0
                fi
                sleep 5
              done
              echo "WARNING: No cAdvisor metrics for $NS after 120s, proceeding"
    - name: create-policy
      try:
        - apply:
            resource:
              apiVersion: attune.io/v1alpha1
              kind: AttunePolicy
              metadata:
                name: canary-test
                namespace: e2e-canary-rollout
              spec:
                targetRef:
                  kind: Deployment
                  selector:
                    matchLabels:
                      tier: api
                metricsSource:
                  prometheus:
                    address: http://prometheus-server.monitoring:80
                  minimumDataPoints: 1
                  historyWindow: 1h
                  queryStep: 1m
                  rateWindow: 5m
                cpu:
                  percentile: 95
                  overhead: "20"
                  minAllowed: 50m
                  maxAllowed: "250m"
                  controlledValues: RequestsAndLimits
                  maxChangePercent: 100
                memory:
                  percentile: 99
                  overhead: "30"
                  allowDecrease: true
                  minAllowed: 64Mi
                  maxAllowed: 8Gi
                  controlledValues: RequestsAndLimits
                  maxChangePercent: 100
                updateStrategy:
                  type: Canary
                  cooldown: 1m
                  canary:
                    percentage: 33
                    observationPeriod: 5m
    - name: verify-policy-status
      try:
        - script:
            timeout: 2m
            content: |
              for i in $(seq 1 24); do
                STATUS=$(kubectl get attunepolicy canary-test -n e2e-canary-rollout \
                  -o jsonpath='{.status.workloads.discovered}' 2>/dev/null)
                if [ "$STATUS" -ge 1 ] 2>/dev/null; then
                  echo "Policy discovered $STATUS workload(s)"
                  exit 0
                fi
                sleep 5
              done
              echo "Timed out waiting for policy to discover workloads"
              kubectl get attunepolicy canary-test -n e2e-canary-rollout -o yaml
              exit 1
    - name: verify-resize-occurred
      try:
        - script:
            timeout: 5m
            content: |
              set -e
              for i in $(seq 1 60); do
                RESIZED=$(kubectl get attunepolicy canary-test -n e2e-canary-rollout \
                  -o jsonpath='{.status.workloads.resized}' 2>/dev/null)
                CPU=$(kubectl get pods -n e2e-canary-rollout -l app=canary-app \
                  -o jsonpath='{.items[0].spec.containers[0].resources.requests.cpu}' 2>/dev/null || true)
                if [ "${RESIZED:-0}" -ge 1 ] 2>/dev/null && [ -n "$CPU" ] && [ "$CPU" != "500m" ]; then
                  case "$CPU" in
                    1|1000m|2|2000m|4000m)
                      echo "FAIL: idle pause resized CPU up to $CPU"
                      exit 1
                      ;;
                  esac
                  echo "Resize confirmed: resized=$RESIZED liveCPU=$CPU (below 500m start)"
                  exit 0
                fi
                echo "Waiting... resized=$RESIZED cpu=$CPU"
                sleep 5
              done
              echo "No downward resize within timeout"
              kubectl get attunepolicy canary-test -n e2e-canary-rollout -o yaml
              kubectl get pods -n e2e-canary-rollout -l app=canary-app -o yaml
              exit 1
    - name: verify-canary-fraction
      try:
        - script:
            timeout: 5m
            content: |
              # 33% of 3 pods is 1. Count CPU or memory leaving the
              # template. The first Success can be memory-only (CPU 500m
              # -> 500m) while CPU drops on a later cycle.
              NS=e2e-canary-rollout
              seen=0
              stable=0
              for i in $(seq 1 48); do
                changed=0
                unchanged=0
                pods=$(kubectl get pods -n "$NS" -l app=canary-app \
                  --field-selector=status.phase=Running \
                  -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.containers[0].resources.requests.cpu}{"\t"}{.spec.containers[0].resources.requests.memory}{"\n"}{end}')
                echo "$pods" | while IFS="$(printf '\t')" read -r _name cpu mem; do
                  [ -z "$_name" ] && continue
                  if { [ "$cpu" = "500m" ] || [ "$cpu" = "0.5" ]; } && \
                     { [ "$mem" = "512Mi" ] || [ "$mem" = "512M" ]; }; then
                    echo unchanged
                  else
                    echo changed
                  fi
                done > /tmp/canary-frac-$$
                changed=$(grep -c '^changed$' /tmp/canary-frac-$$ || true)
                unchanged=$(grep -c '^unchanged$' /tmp/canary-frac-$$ || true)
                rm -f /tmp/canary-frac-$$
                if [ "$changed" -gt 1 ]; then
                  echo "FAIL: $changed pods left template size (want 1 of 3)"
                  kubectl get pods -n "$NS" -o wide
                  kubectl get attunepolicy canary-test -n "$NS" -o yaml
                  exit 1
                fi
                if [ "$changed" -eq 1 ] && [ "$unchanged" -eq 2 ]; then
                  seen=1
                  stable=$((stable + 1))
                  if [ "$stable" -ge 2 ]; then
                    echo "OK: canary fraction held at 1/3 for ${stable}x5s"
                    exit 0
                  fi
                else
                  stable=0
                fi
                sleep 5
              done
              echo "FAIL: changed=$changed unchanged=$unchanged seen=$seen"
              kubectl get pods -n "$NS" -o wide
              kubectl get attunepolicy canary-test -n "$NS" -o yaml
              exit 1
  catch:
    - describe:
        apiVersion: attune.io/v1alpha1
        kind: AttunePolicy
        namespace: e2e-canary-rollout
    - describe:
        apiVersion: apps/v1
        kind: Deployment
        namespace: e2e-canary-rollout
    - podLogs:
        namespace: attune-system
        selector: app.kubernetes.io/name=attune
