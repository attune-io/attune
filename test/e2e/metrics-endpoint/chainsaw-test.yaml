apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: metrics-endpoint
spec:
  description: Verify that the operator exposes Prometheus metrics at the /metrics endpoint
  timeouts:
    apply: 30s
    assert: 1m
    delete: 30s
  steps:
    - name: scrape-metrics
      try:
        - script:
            timeout: 60s
            content: |
              set -e
              # HistogramVec and CounterVec omit unused label sets. Require a
              # series controller-runtime emits at registration, not after
              # the first successful reconcile.
              METRICS_PORT=$(kubectl get svc attune-metrics -n attune-system \
                -o jsonpath='{.spec.ports[0].port}')
              kubectl port-forward -n attune-system svc/attune-metrics \
                "18080:${METRICS_PORT}" >/tmp/e2e-metrics-pf.log 2>&1 &
              PF_PID=$!
              trap 'kill "$PF_PID" 2>/dev/null || true' EXIT
              NEED='controller_runtime_max_concurrent_reconciles{controller="attunepolicy"}'
              found=0
              for i in $(seq 1 30); do
                if ! kill -0 "$PF_PID" 2>/dev/null; then
                  echo "port-forward exited before /metrics became reachable"
                  cat /tmp/e2e-metrics-pf.log
                  exit 1
                fi
                if curl -sf http://localhost:18080/metrics \
                  > /tmp/e2e-metrics.txt 2>/tmp/e2e-metrics.err; then
                  if grep -q "$NEED" /tmp/e2e-metrics.txt; then
                    found=1
                    break
                  fi
                fi
                if [ "$i" -eq 30 ]; then
                  echo "FAIL: missing $NEED"
                  echo "--- /metrics scrape ---"
                  cat /tmp/e2e-metrics.txt 2>/dev/null || true
                  echo "--- curl stderr ---"
                  cat /tmp/e2e-metrics.err 2>/dev/null || true
                  echo "--- port-forward ---"
                  cat /tmp/e2e-metrics-pf.log
                  echo "--- reconcile_total ---"
                  grep controller_runtime_reconcile_total \
                    /tmp/e2e-metrics.txt 2>/dev/null || true
                  echo "--- workqueue_adds_total ---"
                  grep workqueue_adds_total \
                    /tmp/e2e-metrics.txt 2>/dev/null || true
                  exit 1
                fi
                sleep 1
              done
              [ "$found" -eq 1 ]
              echo "All expected metrics found"
      catch:
        - script:
            content: |
              kubectl logs -n attune-system -l app.kubernetes.io/name=attune --tail=20
