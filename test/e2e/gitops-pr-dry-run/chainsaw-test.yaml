apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: gitops-pr-dry-run
spec:
  description: >
    Verify opt-in GitOps PR automation dry-run sets status condition
    PullRequestDryRun (or subsequent PullRequestUnchanged/Cooldown) without forge
    credentials or outbound HTTP. Missing-secret path is unit-tested.
  timeouts:
    apply: 30s
    assert: 5m
    delete: 30s
  steps:
    - name: create-resources
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: e2e-gitops-pr-dry-run
        - apply:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: gitops-token
                namespace: e2e-gitops-pr-dry-run
              type: Opaque
              stringData:
                token: dry-run-not-used
        - apply:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: gitops-app
                namespace: e2e-gitops-pr-dry-run
              spec:
                replicas: 1
                selector:
                  matchLabels:
                    app: gitops-app
                template:
                  metadata:
                    labels:
                      app: gitops-app
                  spec:
                    containers:
                      - name: app
                        image: registry.k8s.io/pause:3.9
                        resources:
                          requests:
                            cpu: 500m
                            memory: 512Mi
        - apply:
            resource:
              apiVersion: attune.io/v1alpha1
              kind: AttunePolicy
              metadata:
                name: gitops-pr-dry
                namespace: e2e-gitops-pr-dry-run
              spec:
                targetRef:
                  kind: Deployment
                  name: gitops-app
                metricsSource:
                  prometheus:
                    address: http://prometheus-server.monitoring:80
                  minimumDataPoints: 1
                  historyWindow: 1h
                cpu:
                  percentile: 95
                  overhead: "20"
                  minAllowed: 50m
                  maxAllowed: "4000m"
                memory:
                  percentile: 99
                  overhead: "30"
                  minAllowed: 64Mi
                  maxAllowed: 8Gi
                updateStrategy:
                  type: Recommend
                  cooldown: 1m
                  export:
                    pullRequest:
                      enabled: true
                      dryRun: true
                      provider: github
                      repository: example/does-not-matter
                      minChangePercent: 1
                      tokenSecretRef:
                        name: gitops-token
                        key: token
                      baseBranch: main
    - name: wait-prometheus-metrics
      try:
        - script:
            timeout: 2m
            content: |
              PROM_POD=$(kubectl get pods -n monitoring -l app.kubernetes.io/name=prometheus,app.kubernetes.io/component=server -o name | head -1)
              NS="e2e-gitops-pr-dry-run"
              ENCODED_QUERY="container_cpu_usage_seconds_total%7Bnamespace%3D%22${NS}%22%2Ccontainer%21%3D%22%22%7D"
              for i in $(seq 1 24); do
                result=$(kubectl exec -n monitoring "$PROM_POD" -- \
                  wget -qO- "http://localhost:9090/api/v1/query?query=${ENCODED_QUERY}" 2>/dev/null || true)
                if echo "$result" | grep -q '"result":\[{'; then
                  echo "cAdvisor metrics available for namespace $NS after ${i}x5s"
                  exit 0
                fi
                sleep 5
              done
              echo "WARNING: No cAdvisor metrics for $NS after 120s, proceeding"

    - name: wait-dry-run-condition
      try:
        - script:
            timeout: 5m
            content: |
              NS=e2e-gitops-pr-dry-run
              POL=gitops-pr-dry
              for i in $(seq 1 60); do
                reason=$(kubectl -n "$NS" get attunepolicy "$POL" \
                  -o jsonpath='{range .status.conditions[?(@.type=="GitOpsPullRequest")]}{.reason}{end}' 2>/dev/null || true)
                msg=$(kubectl -n "$NS" get attunepolicy "$POL" \
                  -o jsonpath='{range .status.conditions[?(@.type=="GitOpsPullRequest")]}{.message}{end}' 2>/dev/null || true)
                status=$(kubectl -n "$NS" get attunepolicy "$POL" \
                  -o jsonpath='{range .status.conditions[?(@.type=="GitOpsPullRequest")]}{.status}{end}' 2>/dev/null || true)
                ann=$(kubectl -n "$NS" get attunepolicy "$POL" \
                  -o jsonpath='{.metadata.annotations.attune\.io/gitops-pr-last-attempt}' 2>/dev/null || true)
                recs=$(kubectl -n "$NS" get attunepolicy "$POL" \
                  -o jsonpath='{.status.recommendations[*].workload}' 2>/dev/null || true)
                # Dry-run sets PullRequestDryRun + last-attempt annotation. The next
                # reconcile is PullRequestUnchanged (same drift table) or
                # PullRequestCooldown. All prove the path ran without forge HTTP.
                if [ -n "$ann" ]; then
                  if [ "$reason" = "PullRequestDryRun" ] || [ "$reason" = "PullRequestCooldown" ] || [ "$reason" = "PullRequestUnchanged" ]; then
                    echo "OK: GitOpsPullRequest reason=$reason status=$status (post dry-run)"
                    echo "message=$msg"
                    echo "annotation last-attempt=$ann"
                    case "$msg" in
                      *dry-run-not-used*|*Bearer*|*ghp_*)
                        echo "FAIL: token material leaked into condition message"
                        exit 1
                        ;;
                    esac
                    exit 0
                  fi
                fi
                echo "waiting i=$i reason='$reason' status='$status' ann='$ann' recs='$recs'"
                sleep 5
              done
              echo "FAIL: PullRequestDryRun not observed"
              kubectl -n "$NS" get attunepolicy "$POL" -o yaml || true
              kubectl -n attune-system logs -l app.kubernetes.io/name=attune --tail=80 || true
              exit 1

  catch:
    - podLogs:
        namespace: attune-system
        selector: app.kubernetes.io/name=attune
