name: Artifact Hub reindex marker

# Artifact Hub's OCI Helm tracker hashes the semver tag list, and it stores
# an empty per-version digest. Existing versions are therefore never opened
# again. A new tag is read once. refresh-0.1.26 pulls that chart, deletes
# the tag, waits until Artifact Hub drops the version, then pushes the same
# archive back so the next tracker run reads Chart.yaml.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "add or remove the 0.0.0-ah1181 marker. refresh-0.1.26 drops that tag until Artifact Hub forgets it, then publishes it again."
        required: true
        type: choice
        options:
          - add
          - remove
          - refresh-0.1.26
        default: add

concurrency:
  group: artifact-hub-reindex-marker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  marker:
    name: Artifact Hub reindex marker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        if: inputs.action == 'add'
        with:
          version: v4.1.4

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: inputs.action == 'add'

      - name: Login to GHCR
        if: inputs.action == 'add'
        shell: bash -Eeuo pipefail {0}
        env:
          REGISTRY_USER: ${{ github.actor }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "$REGISTRY_USER" --password-stdin

      - name: Publish marker chart
        if: inputs.action == 'add'
        shell: bash -Eeuo pipefail {0}
        run: |
          work="$(mktemp -d)"
          mkdir -p "$work/attune"
          printf '%s\n' \
            'apiVersion: v2' \
            'name: attune' \
            'description: Marker so Artifact Hub re-reads existing chart versions. Not for install.' \
            'type: application' \
            'version: 0.0.0-ah1181' \
            'appVersion: "0.0.0"' \
            'annotations:' \
            '  artifacthub.io/images: |' \
            '    - name: attune' \
            '      image: ghcr.io/attune-io/attune:0.1.39' \
            > "$work/attune/Chart.yaml"
          tgz="$(helm package "$work/attune" --destination "$work" | awk -F': ' '/saved it to/{print $2}')"
          helm push "$tgz" oci://ghcr.io/attune-io/charts
          cosign sign --yes ghcr.io/attune-io/charts/attune:0.0.0-ah1181

      - name: Delete marker chart
        if: inputs.action == 'remove'
        shell: bash -Eeuo pipefail {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id="$(gh api --paginate "/orgs/attune-io/packages/container/charts%2Fattune/versions" \
            --jq '.[] | select(any(.metadata.container.tags[]?; . == "0.0.0-ah1181")) | .id' \
            | head -n 1)"
          if [[ -z "$id" ]]; then
            echo "OK: marker tag is already gone"
            exit 0
          fi
          gh api --method DELETE "/orgs/attune-io/packages/container/charts%2Fattune/versions/${id}"
          echo "OK: deleted package version ${id}"

  refresh:
    name: Refresh chart 0.1.26
    if: inputs.action == 'refresh-0.1.26'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with:
          version: v4.1.4

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GHCR for Helm
        shell: bash -Eeuo pipefail {0}
        env:
          REGISTRY_USER: ${{ github.actor }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "$REGISTRY_USER" --password-stdin

      - name: Drop 0.1.26 until Artifact Hub re-reads it
        shell: bash -Eeuo pipefail {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          work="$(mktemp -d)"
          helm pull oci://ghcr.io/attune-io/charts/attune --version 0.1.26 --destination "$work"
          tgz="$work/attune-0.1.26.tgz"
          if tar -xOf "$tgz" attune/Chart.yaml | grep -q 'ghcr.io/attune-io/attune:latest'; then
            echo "FAIL: pulled chart still names :latest"
            exit 1
          fi
          id="$(gh api --paginate "/orgs/attune-io/packages/container/charts%2Fattune/versions" \
            --jq '.[] | select(any(.metadata.container.tags[]?; . == "0.1.26")) | .id' \
            | head -n 1)"
          if [[ -z "$id" ]]; then
            echo "FAIL: package version 0.1.26 was not found"
            exit 1
          fi
          gh api --method DELETE "/orgs/attune-io/packages/container/charts%2Fattune/versions/${id}"
          echo "DO: deleted 0.1.26 (${id})"
          set +e
          python3 -c 'import json,sys,time,urllib.request; url="https://artifacthub.io/api/v1/packages/helm/attune/attune"; deadline=time.time()+50*60; exec("while time.time()<deadline:\n req=urllib.request.Request(url, headers={\"User-Agent\":\"attune-maintainer\"})\n doc=json.load(urllib.request.urlopen(req, timeout=30))\n present=\"0.1.26\" in [item.get(\"version\") for item in doc.get(\"available_versions\") or []]\n print(\"present\", present, flush=True)\n if not present:\n  sys.exit(0)\n time.sleep(60)\nsys.exit(2)")'
          status=$?
          set -e
          helm push "$tgz" oci://ghcr.io/attune-io/charts
          cosign sign --yes ghcr.io/attune-io/charts/attune:0.1.26
          if [[ "$status" -ne 0 ]]; then
            echo "FAIL: Artifact Hub did not drop 0.1.26; the tag was restored"
            exit 1
          fi
          echo "OK: 0.1.26 was gone from Artifact Hub and has been published again"
