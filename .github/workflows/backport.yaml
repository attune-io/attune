name: Backport

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: backport-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backport:
    name: Backport
    permissions:
      # contents:write + pull-requests:write required by backport-action to create
      # backport PRs. Scoped to job level.
      contents: write
      pull-requests: write
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    if: >
      github.event.pull_request.merged == true &&
      contains(toJSON(github.event.pull_request.labels), 'backport/')
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: korthout/backport-action@ad272ff24e4a8593bf18a951a154ae6af93b26b8 # v5.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          label_pattern: "^backport/(.+)$"
          pull_description: |
            Backport of #${pull_number} to `${target_branch}`.

            Original PR: #${pull_number}
            ---
            ${pull_description}
