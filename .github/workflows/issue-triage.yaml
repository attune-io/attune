name: Issue Triage
on:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    name: Auto-label new issues
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # Read author_association from the API. The webhook value has marked
      # MEMBER issues needs-triage. A failed read leaves labels unchanged.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            let fresh;
            try {
              fresh = await github.rest.issues.get({ owner, repo, issue_number });
            } catch (err) {
              core.warning(`Issue triage left labels unchanged: ${err.message}`);
              return;
            }
            const assoc = fresh.data.author_association || '';
            const names = new Set((fresh.data.labels || []).map((label) => label.name));
            const trusted = ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(assoc);
            if (trusted) {
              if (!names.has('ready')) {
                await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['ready'] });
              }
              if (names.has('needs-triage')) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: 'needs-triage' });
              }
              return;
            }
            if (names.has('ready')) {
              return;
            }
            if (!names.has('needs-triage')) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['needs-triage'] });
            }
