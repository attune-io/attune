name: Republish chart images

# Manual repair for chart versions whose artifacthub.io/images annotation
# still says :latest. Re-pushing a chart replaces its digest, so this job
# signs the new digest. It does not run on pull requests or on main.

on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Space-separated chart versions such as 0.1.26 0.1.27. Empty selects every published chart version."
        required: false
        type: string
        default: ""
      push:
        description: "Push the rewritten charts and sign them. Leave false to print the plan."
        required: true
        type: boolean
        default: false

concurrency:
  group: republish-chart-images
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  republish:
    name: Republish chart images
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with:
          version: v4.1.4

      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2 (includes 1.3.2)
        with:
          version: "1.3.2"

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Login to GHCR
        if: inputs.push
        shell: bash -Eeuo pipefail {0}
        env:
          # github.actor stays in env. Expanding it inside run: is a
          # zizmor template-injection finding.
          REGISTRY_USER: ${{ github.actor }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "$REGISTRY_USER" --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io \
            --username "$REGISTRY_USER" --password-stdin

      - name: Login to Docker Hub
        if: inputs.push
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Docker Hub (oras)
        if: inputs.push
        shell: bash -Eeuo pipefail {0}
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | oras login registry-1.docker.io \
            --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Republish chart image annotations
        shell: bash -Eeuo pipefail {0}
        env:
          VERSIONS: ${{ inputs.versions }}
          PUSH: ${{ inputs.push }}
        run: |
          args=()
          if [[ -n "${VERSIONS}" ]]; then
            for version in ${VERSIONS}; do
              args+=(--version "${version}")
            done
          else
            args+=(--all)
          fi
          if [[ "${PUSH}" == "true" ]]; then
            args+=(--push)
          fi
          bash hack/republish-chart-images.sh "${args[@]}"
