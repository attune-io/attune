name: Dependabot Auto-Merge

on:
  pull_request_target:

permissions:
  contents: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Auto-merge Dependabot PRs
    permissions:
      # contents:write + pull-requests:write required for gh pr review + gh pr merge --auto.
      # This is the minimum for the auto-merge functionality on pull_request_target.
      # See Scorecard Token-Permissions: writes are justified here but kept scoped to the job.
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          skip-commit-verification: true

      # Approve with GITHUB_TOKEN (satisfies required-review rulesets).
      # Enable auto-merge with the release App token so the eventual squash
      # merge to main is NOT attributed to GITHUB_TOKEN. Merges created with
      # GITHUB_TOKEN do not re-trigger push workflows on main (GitHub
      # infinite-loop prevention), which left go.mod and Actions bumps without
      # CI/Security/Docs on the merge commit (observed after #515/#516).
      # Same App-token pattern as auto-approve.yaml for non-Dependabot PRs.
      - name: Approve PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr review --approve "$PR_URL"

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge --auto --squash "$PR_URL"
          echo "Auto-merge enabled for ${{ steps.metadata.outputs.update-type }} update"

      # Dependabot docker PRs bump Dockerfile golang:X.Y.Z but not go.mod.
      # setup-go / govulncheck read go.mod, so a Dockerfile-only bump stays
      # red on stdlib CVEs. Copy the image tag into go.mod with the App
      # token so the extra commit retriggers CI (GITHUB_TOKEN would not).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.metadata.outputs.package-ecosystem == 'docker'
        with:
          persist-credentials: false

      - name: Sync go.mod with Dockerfile golang tag
        if: steps.metadata.outputs.package-ecosystem == 'docker'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
        shell: bash -Eeuo pipefail {0}
        run: |
          # Copy the script from this trusted main checkout before switching
          # to the Dependabot branch (do not execute PR-controlled files).
          if [[ ! -f hack/verify-go-version-sync.sh ]]; then
            echo "OK: sync script not on this main yet; skip"
            exit 0
          fi
          cp hack/verify-go-version-sync.sh /tmp/verify-go-version-sync.sh
          git fetch origin "$PR_BRANCH"
          git checkout -B "sync-go-version" "origin/${PR_BRANCH}"
          bash /tmp/verify-go-version-sync.sh --write
          if git diff --quiet -- go.mod; then
            echo "OK: go.mod already matches Dockerfile"
            exit 0
          fi
          git config user.name "attune-release-bot[bot]"
          git config user.email "3904235+attune-release-bot[bot]@users.noreply.github.com"
          git add go.mod
          git commit -s -m "chore(deps): sync go.mod with Dockerfile golang tag"
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
            "HEAD:refs/heads/${PR_BRANCH}"
          echo "OK: pushed go.mod sync to ${PR_BRANCH}"

  # NOTE: A rebase-dependabot job was removed here. It updated open
  # Dependabot PR branches on every push to main, but caused more harm
  # than good: GITHUB_TOKEN pushes do not trigger other workflows (GitHub
  # infinite-loop prevention), so the rebase invalidated existing CI
  # results without starting new ones, leaving PRs stuck in "no required
  # checks reported" limbo. With strict_required_status_checks_policy
  # disabled in the branch ruleset, PRs can merge when behind main, so
  # auto-rebase is unnecessary. Dependabot handles its own rebases when
  # conflicts arise.
  #
  # See AGENTS.md "Handling Dependabot PRs" for the supported process
  # (always rebase cleanly when helping a PR; the DCO workflow skips merge
  # commits to avoid blocking legitimate updates). This design protects
  # our high Scorecard scores (CI-Tests=10, Branch-Protection, etc.).