version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # Rebase when main moves so auto-merge is not stuck BEHIND.
    rebase-strategy: auto
    labels:
      - dependencies
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      k8s:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
      # First-match group order: k8s stays exclusive; remaining minor/patch
      # land in one PR instead of N lockfile PRs.
      go-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    rebase-strategy: auto
    labels:
      - dependencies
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: monthly
    rebase-strategy: auto
    labels:
      - dependencies
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One docs PR per month for minor/patch. Majors (e.g. backrefs 7->8)
      # stay ungrouped so a docs API break is reviewed alone.
      docs-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    rebase-strategy: auto
    labels:
      - dependencies
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
